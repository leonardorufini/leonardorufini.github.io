  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e=\"color:#4B5070; display:none\" style-hover=\"color:#232A63\" data-nav=\"1\">Lezioni<\u002Fa>\n        <a href=\"#prezzi\" style=\"color:#4B5070; display:none\" style-hover=\"color:#232A63\" data-nav=\"1\">Prezzi<\u002Fa>\n        <a href=\"#contatti\" style=\"display:flex; align-items:center; min-height:44px; background:#232A63; color:#fff; padding:0 clamp(14px,3.6vw,20px); border-radius:999px; font-weight:600; font-size:clamp(13.5px,3.4vw,15px); white-space:nowrap\" style-hover=\"background:#E2652B; color:#fff\">Contattami<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"position:relative; padding:clamp(64px,9vw,120px) 22px clamp(56px,7vw,96px); background:radial-gradient(120% 90% at 12% 0%, #EEF0FF 0%, #FBFAF7 55%, #FBFAF7 100%)\">\n    <div style=\"position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(#232A63 1px, transparent 1px), linear-gradient(90deg, #232A63 1px, transparent 1px); background-size:64px 64px; opacity:0.05; mask-image:radial-gradient(80% 70% at 70% 10%, #000 0%, transparent 75%); -webkit-mask-image:radial-gradient(80% 70% at 70% 10%, #000 0%, transparent 75%)\"><\u002Fdiv>\n    <div style=\"position:absolute; top:-90px; right:-70px; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle at 35% 35%, rgba(226,101,43,0.22), rgba(226,101,43,0) 70%); pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative; max-width:1140px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:clamp(32px,5vw,64px); align-items:center\">\n      <div style=\"min-width:0\">\n        <div data-reveal=\"1\" style=\"display:inline-flex; align-items:center; gap:9px; background:#fff; border:1px solid #E2E0F0; padding:7px 14px 7px 10px; border-radius:999px; font-size:13.5px; font-weight:600; color:#2A3186; margin-bottom:26px\">\n          <span style=\"width:7px; height:7px; border-radius:50%; background:#0FA678\"><\u002Fspan>\n          Da novembre dottorando in Cybersecurity alla Sapienza\n        <\u002Fdiv>\n        <h1 data-reveal=\"1\" style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(38px,5.4vw,62px); line-height:1.06; letter-spacing:-0.03em; margin:0 0 22px; color:#171A33; text-wrap:balance\">\n          Ripetizioni di <span style=\"color:#2A3186\">Matematica<\u002Fspan>, <span style=\"color:#2A3186\">Fisica<\u002Fspan> e <span style=\"color:#2A3186\">Informatica<\u002Fspan>\n        <\u002Fh1>\n        <p data-reveal=\"1\" style=\"font-size:clamp(17px,1.7vw,20px); line-height:1.6; color:#4B5070; margin:0 0 34px; max-width:540px; text-wrap:pretty\">\n          Lezioni private per le superiori e per l'università. Individuiamo con precisione le lacune da colmare e lavoriamo sull'argomento fino a una padronanza autonoma.\n        <\u002Fp>\n        <div data-reveal=\"1\" style=\"display:flex; flex-wrap:wrap; gap:12px; align-items:stretch\">\n          <a href=\"#contatti\" data-hero-cta=\"1\" style=\"background:#E2652B; color:#fff; padding:clamp(13px,3.4vw,16px) clamp(18px,4.6vw,26px); border-radius:14px; font-family:Sora,sans-serif; font-weight:600; font-size:clamp(14.5px,3.6vw,16px); flex:1 1 220px; text-align:center; box-shadow:0 12px 26px -12px rgba(226,101,43,0.7)\" style-hover=\"background:#C9541F; color:#fff; transform:translateY(-2px)\">Prenota ora<\u002Fa>\n          <a href=\"#chi-sono\" style=\"background:#fff; color:#232A63; padding:clamp(13px,3.4vw,16px) clamp(16px,4.4vw,24px); border-radius:14px; font-family:Sora,sans-serif; font-weight:600; font-size:clamp(14.5px,3.6vw,16px); flex:1 1 180px; text-align:center; border:1px solid #DCD8CD\" style-hover=\"border-color:#232A63; color:#232A63\">Scopri di più<\u002Fa>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"display:flex; flex-wrap:wrap; gap:26px; margin-top:40px; font-size:14.5px; color:#6A6F8C; font-weight:500\">\n          <span>Online o in presenza a Roma<\u002Fspan>\n          <span style=\"color:#CFCBBF\">•<\u002Fspan>\n          <span>Durata concordata<\u002Fspan>\n          <span style=\"color:#CFCBBF\">•<\u002Fspan>\n          <span>Da 20 €/ora<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"min-width:0; display:flex; justify-content:center\">\n        <div style=\"width:100%; max-width:430px; background:#fff; border:1px solid #E7E3DA; border-radius:24px; padding:clamp(24px,3vw,34px); box-shadow:0 40px 80px -50px rgba(23,26,51,0.45)\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:#5A5F7C; letter-spacing:0.04em; margin-bottom:18px\">COME PROCEDIAMO<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:18px\">\n            <div style=\"display:flex; gap:14px; align-items:flex-start\">\n              <span style=\"flex:none; width:32px; height:32px; border-radius:10px; background:#EEF0FF; color:#2A3186; display:flex; align-items:center; justify-content:center; font-family:Sora,sans-serif; font-weight:600; font-size:14px\">1<\u002Fspan>\n              <div style=\"min-width:0\"><div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15px,4vw,16px); margin-bottom:4px\">Programma e scadenze<\u002Fdiv><div style=\"font-size:14.5px; color:#6A6F8C; line-height:1.55\">Esaminiamo insieme programma, scadenze e argomenti da recuperare.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:14px; align-items:flex-start\">\n              <span style=\"flex:none; width:32px; height:32px; border-radius:10px; background:#EEF0FF; color:#2A3186; display:flex; align-items:center; justify-content:center; font-family:Sora,sans-serif; font-weight:600; font-size:14px\">2<\u002Fspan>\n              <div style=\"min-width:0\"><div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15px,4vw,16px); margin-bottom:4px\">Costruiamo le basi<\u002Fdiv><div style=\"font-size:14.5px; color:#6A6F8C; line-height:1.55\">La teoria viene spiegata in modo accessibile e sempre ancorata a esempi concreti.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:14px; align-items:flex-start\">\n              <span style=\"flex:none; width:32px; height:32px; border-radius:10px; background:#FDEDE4; color:#C9541F; display:flex; align-items:center; justify-content:center; font-family:Sora,sans-serif; font-weight:600; font-size:14px\">3<\u002Fspan>\n              <div style=\"min-width:0\"><div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15px,4vw,16px); margin-bottom:4px\">Ci alleniamo sugli esercizi<\u002Fdiv><div style=\"font-size:14.5px; color:#6A6F8C; line-height:1.55\">Esercizi tratti da compiti e prove d'esame, prima svolti insieme e poi affrontati in autonomia.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:26px; padding-top:20px; border-top:1px solid #F0EDE5; font-size:14px; color:#4B5070; line-height:1.5\">\n            <strong style=\"color:#171A33\">La durata della lezione è concordata.<\u002Fstrong> Un'ora, due o più: si corrisponde soltanto il tempo effettivamente svolto, secondo la tariffa oraria.\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"chi-sono\" style=\"padding:clamp(64px,8vw,110px) 22px; background:#FBFAF7\">\n    <div style=\"max-width:1140px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:clamp(32px,5vw,70px); align-items:start\">\n      <div data-reveal=\"1\" style=\"min-width:0\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:#E2652B; letter-spacing:0.08em; margin-bottom:16px\">CHI SONO<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:clamp(16px,3vw,22px); margin:0 0 24px\">\n          <img src=\"8bba9023-6903-4f72-b92b-31b0fe6843ce\" alt=\"Leonardo Rufini\" width=\"132\" height=\"132\" style=\"flex:none; width:clamp(112px,28vw,176px); height:clamp(112px,28vw,176px); border-radius:26px; object-fit:cover; object-position:50% 22%; border:1px solid #E7E3DA; box-shadow:0 24px 44px -28px rgba(23,26,51,0.55)\">\n          <div style=\"min-width:0\">\n            <h2 style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(26px,3.6vw,42px); line-height:1.1; letter-spacing:-0.025em; margin:0 0 8px; text-wrap:balance\">Ciao, sono Leonardo<\u002Fh2>\n            <div style=\"font-size:clamp(14px,3.6vw,15.5px); color:#5A5F7C; line-height:1.5\">Dottorando in Cybersecurity alla Sapienza di Roma<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:16.5px; line-height:1.72; color:#4B5070; display:flex; flex-direction:column; gap:16px; max-width:560px\">\n          <p style=\"margin:0\">Ho concluso la <strong style=\"color:#171A33\">laurea magistrale in Ingegneria Informatica alla Sapienza di Roma con 110 e lode<\u002Fstrong>, ottenendo anche l'attestato del <strong style=\"color:#171A33\">Percorso di Eccellenza<\u002Fstrong> della Sapienza. Nello stesso periodo ho vinto il concorso di dottorato con borsa: da novembre inizio il mio <strong style=\"color:#171A33\">PhD in Cybersecurity<\u002Fstrong>, che segnerà anche l'inizio della mia attività di assistenza alle lezioni accademiche in università.<\u002Fp>\n          <p style=\"margin:0\">Sono materie che utilizzo quotidianamente nella ricerca e che, con l'inizio del dottorato, affiancherò anche in aula come assistente alle lezioni. Conosco quindi dall'interno la struttura di un corso universitario e i criteri con cui vengono formulate le prove d'esame.<\u002Fp>\n          <p style=\"margin:0\">Da anni seguo studenti del liceo e dell'università con lezioni private. L'insegnamento mi ha formato quanto lo studio: ho imparato ad ascoltare prima di spiegare, a riconoscere un passaggio rimasto oscuro anche quando non viene dichiarato, e a scomporre gli argomenti più impegnativi in passaggi affrontabili. Il risultato a cui tengo non è il voto della prossima verifica, ma la sicurezza con cui uno studente apre il libro sapendo già come procedere.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"min-width:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:14px\">\n        <div style=\"background:#232A63; color:#fff; border-radius:20px; padding:26px; grid-column:1/-1\">\n          <div style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(22px,2.4vw,28px); letter-spacing:-0.025em; line-height:1.2\">PhD in Cybersecurity<\u002Fdiv>\n          <div style=\"font-size:14.5px; color:#B9BEE8; margin-top:8px; line-height:1.55\">Dottorato con borsa alla Sapienza, dal novembre 2026, con le prime assistenze alle lezioni universitarie<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid #E7E3DA; border-radius:20px; padding:26px\">\n          <div style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(28px,7.5vw,36px); letter-spacing:-0.03em; color:#2A3186\">110L<\u002Fdiv>\n          <div style=\"font-size:14.5px; color:#6A6F8C; margin-top:6px; line-height:1.5\">Magistrale in Ingegneria Informatica, Sapienza<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid #E7E3DA; border-radius:20px; padding:26px\">\n          <div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.01em; color:#C9541F; line-height:1.35\">Esperienza pluriennale<\u002Fdiv>\n          <div style=\"font-size:14.5px; color:#6A6F8C; margin-top:8px; line-height:1.5\">Lezioni private a studenti di liceo e università<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#F3F1FF; border:1px solid #E2E0F0; border-radius:20px; padding:26px; grid-column:1/-1\">\n          <div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.01em; color:#232A63; line-height:1.35\">Percorso di Eccellenza Sapienza<\u002Fdiv>\n          <div style=\"font-size:14.5px; color:#6A6F8C; margin-top:8px; line-height:1.5\">Attestato del programma riservato agli studenti selezionati per merito<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"materie\" style=\"padding:clamp(64px,8vw,110px) 22px; background:#F4F2EC; border-top:1px solid #E7E3DA; border-bottom:1px solid #E7E3DA\">\n    <div style=\"max-width:1140px; margin:0 auto\">\n      <div data-reveal=\"1\" style=\"max-width:640px; margin-bottom:clamp(34px,4vw,54px)\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:#E2652B; letter-spacing:0.08em; margin-bottom:16px\">LE MATERIE<\u002Fdiv>\n        <h2 style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(28px,3.6vw,42px); line-height:1.12; letter-spacing:-0.025em; margin:0 0 16px; text-wrap:balance\">Le materie che seguo<\u002Fh2>\n        <p style=\"font-size:17px; line-height:1.65; color:#4B5070; margin:0\">Si lavora sul programma del tuo corso, alternando spiegazione teorica ed esercitazione.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:20px\">\n        <div data-reveal=\"1\" style=\"background:#fff; border:1px solid #E7E3DA; border-radius:22px; padding:32px; transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease\" style-hover=\"transform:translateY(-6px); box-shadow:0 30px 60px -40px rgba(23,26,51,0.5); border-color:#C9C4B6\">\n          <div style=\"width:52px; height:52px; border-radius:16px; background:#EEF0FF; color:#2A3186; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:19px; margin-bottom:22px\">∫<\u002Fdiv>\n          <h3 style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(19px,4.8vw,22px); letter-spacing:-0.02em; margin:0 0 12px\">Matematica<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.65; color:#5A5F7C; margin:0 0 18px\">Dalle basi del liceo all'analisi universitaria: algebra, geometria, studio di funzione, limiti, derivate e integrali.<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Algebra<\u002Fspan>\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Geometria<\u002Fspan>\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Analisi I e II<\u002Fspan>\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Probabilità e statistica<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background:#fff; border:1px solid #E7E3DA; border-radius:22px; padding:32px; transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease\" style-hover=\"transform:translateY(-6px); box-shadow:0 30px 60px -40px rgba(23,26,51,0.5); border-color:#C9C4B6\">\n          <div style=\"width:52px; height:52px; border-radius:16px; background:#EEF0FF; color:#2A3186; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:19px; margin-bottom:22px\">F=ma<\u002Fdiv>\n          <h3 style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(19px,4.8vw,22px); letter-spacing:-0.02em; margin:0 0 12px\">Fisica<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.65; color:#5A5F7C; margin:0 0 18px\">Meccanica, elettromagnetismo e termodinamica, per il liceo e per i primi anni di università.<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Meccanica<\u002Fspan>\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Elettromagnetismo<\u002Fspan>\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Termodinamica<\u002Fspan>\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Fisica l e ll<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background:#fff; border:1px solid #E7E3DA; border-radius:22px; padding:32px; transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease\" style-hover=\"transform:translateY(-6px); box-shadow:0 30px 60px -40px rgba(23,26,51,0.5); border-color:#C9C4B6\">\n          <div style=\"width:52px; height:52px; border-radius:16px; background:#FDEDE4; color:#C9541F; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:19px; margin-bottom:22px\">&lt;/&gt;<\u002Fdiv>\n          <h3 style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(19px,4.8vw,22px); letter-spacing:-0.02em; margin:0 0 12px\">Informatica<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.65; color:#5A5F7C; margin:0 0 18px\">Programmazione in Python, Java, C e JavaScript, algoritmi e strutture dati, basi di dati con SQL, HTML e CSS. Rivolto agli studenti di informatica delle superiori e dell'università.<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Python<\u002Fspan>\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Java · C · JS<\u002Fspan>\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">Algoritmi<\u002Fspan>\n            <span style=\"background:#F4F2EC; color:#4B5070; font-size:13px; font-weight:600; padding:6px 11px; border-radius:8px\">SQL<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"perche\" style=\"padding:clamp(64px,8vw,110px) 22px\">\n    <div style=\"max-width:1140px; margin:0 auto\">\n      <div data-reveal=\"1\" style=\"max-width:640px; margin-bottom:clamp(34px,4vw,54px)\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:#E2652B; letter-spacing:0.08em; margin-bottom:16px\">PERCHÉ SCEGLIERMI<\u002Fdiv>\n        <h2 style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(28px,3.6vw,42px); line-height:1.12; letter-spacing:-0.025em; margin:0; text-wrap:balance\">Il mio approccio<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr)); gap:18px\">\n        <div data-reveal=\"1\" style=\"background:#fff; border:1px solid #E7E3DA; border-radius:20px; padding:28px; transition:border-color .3s ease, transform .3s ease\" style-hover=\"border-color:#232A63; transform:translateY(-4px)\">\n          <div style=\"width:44px; height:44px; border-radius:13px; background:#EEF0FF; color:#2A3186; display:flex; align-items:center; justify-content:center; margin-bottom:18px\"><span style=\"font-family:'Material Symbols Outlined'; font-size:24px; line-height:1; font-weight:400\">psychology<\u002Fspan><\u002Fdiv>\n          <h3 style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(16.5px,4.3vw,18px); margin:0 0 10px; letter-spacing:-0.01em\">Comprensione, non memoria<\u002Fh3>\n          <p style=\"font-size:15px; line-height:1.6; color:#5A5F7C; margin:0\">Non chiedo mai di imparare a memoria. Ogni problema viene scomposto nei suoi passaggi, perché lo studente sappia con esattezza che cosa sta risolvendo e per quale ragione quel procedimento conduce alla soluzione.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background:#fff; border:1px solid #E7E3DA; border-radius:20px; padding:28px; transition:border-color .3s ease, transform .3s ease\" style-hover=\"border-color:#232A63; transform:translateY(-4px)\">\n          <div style=\"width:44px; height:44px; border-radius:13px; background:#EEF0FF; color:#2A3186; display:flex; align-items:center; justify-content:center; margin-bottom:18px\"><span style=\"font-family:'Material Symbols Outlined'; font-size:24px; line-height:1; font-weight:400\">route<\u002Fspan><\u002Fdiv>\n          <h3 style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(16.5px,4.3vw,18px); margin:0 0 10px; letter-spacing:-0.01em\">Mai bloccati davanti al compito<\u002Fh3>\n          <p style=\"font-size:15px; line-height:1.6; color:#5A5F7C; margin:0\">Trovarsi davanti al compito senza sapere da dove cominciare è la difficoltà che mi viene riferita più spesso. Una base teorica solida e un criterio preciso di lettura del problema garantiscono che il primo passo sia sempre riconoscibile.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background:#fff; border:1px solid #E7E3DA; border-radius:20px; padding:28px; transition:border-color .3s ease, transform .3s ease\" style-hover=\"border-color:#232A63; transform:translateY(-4px)\">\n          <div style=\"width:44px; height:44px; border-radius:13px; background:#EEF0FF; color:#2A3186; display:flex; align-items:center; justify-content:center; margin-bottom:18px\"><span style=\"font-family:'Material Symbols Outlined'; font-size:24px; line-height:1; font-weight:400\">laptop_mac<\u002Fspan><\u002Fdiv>\n          <h3 style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(16.5px,4.3vw,18px); margin:0 0 10px; letter-spacing:-0.01em\">Autonomia e strumenti<\u002Fh3>\n          <p style=\"font-size:15px; line-height:1.6; color:#5A5F7C; margin:0\">Calcolatrice, software grafici e strumenti di intelligenza artificiale: insegno a impiegarli con consapevolezza, come supporto allo studio autonomo e non come scorciatoia. Resto inoltre raggiungibile su WhatsApp per un chiarimento rapido quando un esercizio si rivela ostico.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background:#fff; border:1px solid #E7E3DA; border-radius:20px; padding:28px; transition:border-color .3s ease, transform .3s ease\" style-hover=\"border-color:#232A63; transform:translateY(-4px)\">\n          <div style=\"width:44px; height:44px; border-radius:13px; background:#FDEDE4; color:#C9541F; display:flex; align-items:center; justify-content:center; margin-bottom:18px\"><span style=\"font-family:'Material Symbols Outlined'; font-size:24px; line-height:1; font-weight:400\">schedule<\u002Fspan><\u002Fdiv>\n          <h3 style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(16.5px,4.3vw,18px); margin:0 0 10px; letter-spacing:-0.01em\">Orari e modalità<\u002Fh3>\n          <p style=\"font-size:15px; line-height:1.6; color:#5A5F7C; margin:0\">Lezioni online oppure in presenza a Roma, con orari compatibili anche con le settimane più impegnative.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"lezioni\" style=\"padding:clamp(56px,7vw,96px) 22px\">\n    <div style=\"max-width:1140px; margin:0 auto\">\n      <div data-reveal=\"1\" style=\"background:#232A63; border-radius:28px; padding:clamp(32px,5vw,64px); color:#fff; position:relative; overflow:hidden\">\n        <div style=\"position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.6) 1px, transparent 1px); background-size:48px 48px; opacity:0.07; pointer-events:none\"><\u002Fdiv>\n        <div style=\"position:relative; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:clamp(28px,4vw,56px)\">\n          <div style=\"min-width:0\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:#FFB48C; letter-spacing:0.08em; margin-bottom:16px\">COME FUNZIONANO LE LEZIONI<\u002Fdiv>\n            <h2 style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(26px,3.4vw,40px); line-height:1.14; letter-spacing:-0.025em; margin:0 0 18px; text-wrap:balance\">Lo svolgimento delle lezioni<\u002Fh2>\n            <p style=\"font-size:16.5px; line-height:1.7; color:#C4C8EC; margin:0 0 26px; max-width:440px\">Individuali o in coppia, online oppure in presenza a Roma. Durata, frequenza e argomenti vengono definiti prima di iniziare, in funzione degli obiettivi e delle scadenze da rispettare.<\u002Fp>\n            <a href=\"#contatti\" style=\"display:inline-block; background:#E2652B; color:#fff; padding:clamp(13px,3.4vw,15px) clamp(18px,4.4vw,24px); border-radius:13px; font-family:Sora,sans-serif; font-weight:600; font-size:clamp(14.5px,3.5vw,15.5px)\" style-hover=\"background:#fff; color:#232A63\">Prenota ora<\u002Fa>\n            <p style=\"font-size:14px; line-height:1.65; color:#B9BEE8; margin:22px 0 0; max-width:440px\">Per esperienza la lezione risulta più efficace quando la stessa sessione lascia spazio sia alla teoria sia agli esercizi. Resta un'indicazione, non una regola: per diversi studenti si rivelano preferibili incontri brevi e ravvicinati.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"min-width:0; display:flex; flex-direction:column; gap:14px\">\n            <div style=\"background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); border-radius:16px; padding:20px 22px\">\n              <div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15.5px,4.1vw,16.5px); margin-bottom:6px\">Online o in presenza<\u002Fdiv>\n              <div style=\"font-size:14.5px; line-height:1.6; color:#B9BEE8\">Videochiamata con lavagna condivisa, oppure incontro di persona a Roma.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); border-radius:16px; padding:20px 22px\">\n              <div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15.5px,4.1vw,16.5px); margin-bottom:6px\">Da solo o con un compagno<\u002Fdiv>\n              <div style=\"font-size:14.5px; line-height:1.6; color:#B9BEE8\">Individualmente oppure in due, con chi segue lo stesso programma: la tariffa a persona è più contenuta e lo studio a casa può proseguire in modo condiviso.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); border-radius:16px; padding:20px 22px\">\n              <div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15.5px,4.1vw,16.5px); margin-bottom:6px\">Durata su richiesta<\u002Fdiv>\n              <div style=\"font-size:14.5px; line-height:1.6; color:#B9BEE8\">Si stabilisce di volta in volta: un'ora per un ripasso circoscritto, due per affrontare un argomento nuovo.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); border-radius:16px; padding:20px 22px\">\n              <div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15.5px,4.1vw,16.5px); margin-bottom:6px\">Si lavora sui tuoi materiali<\u002Fdiv>\n              <div style=\"font-size:14.5px; line-height:1.6; color:#B9BEE8\">Libro di testo, dispense e prove d'esame del tuo corso, integrati da esercizi selezionati insieme.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14); border-radius:16px; padding:20px 22px\">\n              <div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15.5px,4.1vw,16.5px); margin-bottom:6px\">Calendario concordato<\u002Fdiv>\n              <div style=\"font-size:14.5px; line-height:1.6; color:#B9BEE8\">Appuntamenti a cadenza fissa oppure su richiesta, intensificati nei periodi di verifiche ed esami.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"prezzi\" style=\"padding:clamp(56px,8vw,100px) 22px clamp(64px,8vw,110px)\">\n    <div style=\"max-width:1140px; margin:0 auto\">\n      <div data-reveal=\"1\" style=\"max-width:640px; margin-bottom:clamp(30px,4vw,48px)\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:#E2652B; letter-spacing:0.08em; margin-bottom:16px\">PREZZI<\u002Fdiv>\n        <h2 style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(28px,3.6vw,42px); line-height:1.12; letter-spacing:-0.025em; margin:0 0 16px; text-wrap:balance\">Tariffe<\u002Fh2>\n        <p style=\"font-size:17px; line-height:1.65; color:#4B5070; margin:0\">Le tariffe sono orarie. La durata di ciascuna lezione viene concordata e si corrispondono soltanto le ore effettivamente svolte.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:20px; align-items:stretch\">\n        <div data-reveal=\"1\" style=\"background:#fff; border:1px solid #E7E3DA; border-radius:24px; padding:clamp(26px,3vw,34px)\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px\">\n            <h3 style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(18.5px,4.6vw,21px); letter-spacing:-0.02em; margin:0\">Lezioni individuali<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"font-size:15px; color:#5A5F7C; line-height:1.6; margin:0 0 26px\">Rapporto individuale, indicato per recuperi circoscritti o per chi deve riprendere le basi.<\u002Fp>\n          <div style=\"display:flex; flex-direction:column; gap:12px\">\n            <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px; background:#F7F6F1; border-radius:14px; padding:18px 20px\">\n              <span style=\"font-weight:600; font-size:16px; color:#171A33\">Medie e Liceo<\u002Fspan>\n              <span style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(21px,5.6vw,26px); letter-spacing:-0.02em; color:#232A63; white-space:nowrap\">25 €<span style=\"font-size:14px; font-weight:500; color:#5A5F7C\">/ora<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px; background:#F7F6F1; border-radius:14px; padding:18px 20px\">\n              <span style=\"font-weight:600; font-size:16px; color:#171A33\">Università<\u002Fspan>\n              <span style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(21px,5.6vw,26px); letter-spacing:-0.02em; color:#232A63; white-space:nowrap\">35 €<span style=\"font-size:14px; font-weight:500; color:#5A5F7C\">/ora<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-reveal=\"1\" style=\"background:#fff; border:2px solid #E2652B; border-radius:24px; padding:clamp(26px,3vw,34px); position:relative; box-shadow:0 30px 60px -45px rgba(226,101,43,0.8)\">\n          <div style=\"position:absolute; top:-13px; left:clamp(26px,3vw,34px); background:#E2652B; color:#fff; font-family:Sora,sans-serif; font-weight:600; font-size:12.5px; letter-spacing:0.04em; padding:6px 13px; border-radius:999px\">DUE STUDENTI, PIÙ VANTAGGI<\u002Fdiv>\n          <h3 style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(18.5px,4.6vw,21px); letter-spacing:-0.02em; margin:0 0 8px\">Lezioni di coppia<\u002Fh3>\n          <p style=\"font-size:15px; color:#5A5F7C; line-height:1.6; margin:0 0 20px\">Due studenti sullo stesso programma, con tariffa a persona: la spesa si riduce e lo studio prosegue in compagnia anche fuori dalla lezione.<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:7px; margin:0 0 22px\">\n            <span style=\"background:#FDEDE4; color:#B0561F; font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:8px\">−20% a persona<\u002Fspan>\n            <span style=\"background:#FDEDE4; color:#B0561F; font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:8px\">Compiti insieme<\u002Fspan>\n            <span style=\"background:#FDEDE4; color:#B0561F; font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:8px\">Più motivazione<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px\">\n            <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px; background:#FDF4EF; border-radius:14px; padding:18px 20px\">\n              <span style=\"font-weight:600; font-size:16px; color:#171A33\">Liceo<\u002Fspan>\n              <span style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(21px,5.6vw,26px); letter-spacing:-0.02em; color:#C9541F; white-space:nowrap\">20 €<span style=\"font-size:14px; font-weight:500; color:#B0561F\">/ora a persona<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px; background:#FDF4EF; border-radius:14px; padding:18px 20px\">\n              <span style=\"font-weight:600; font-size:16px; color:#171A33\">Università<\u002Fspan>\n              <span style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(21px,5.6vw,26px); letter-spacing:-0.02em; color:#C9541F; white-space:nowrap\">30 €<span style=\"font-size:14px; font-weight:500; color:#B0561F\">/ora a persona<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"margin-top:34px; background:#fff; border:1px solid #E7E3DA; border-radius:24px; padding:clamp(26px,3.4vw,40px)\">\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:clamp(26px,4vw,48px); align-items:start\">\n          <div style=\"min-width:0\">\n            <div style=\"display:inline-flex; align-items:center; gap:8px; background:#FDEDE4; color:#B0561F; font-size:12.5px; font-weight:700; letter-spacing:0.05em; padding:6px 12px; border-radius:999px; margin-bottom:16px\">STUDIARE IN DUE<\u002Fdiv>\n            <h3 style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(21px,3vw,30px); line-height:1.18; letter-spacing:-0.025em; margin:0 0 14px; text-wrap:balance\">Il valore delle lezioni in coppia<\u002Fh3>\n            <p style=\"font-size:15.5px; line-height:1.7; color:#5A5F7C; margin:0 0 18px\">È una formula che propongo personalmente, nata osservando l'andamento delle mie lezioni. Con due studenti allineati sullo stesso programma la spiegazione resta integrale per entrambi, con un vantaggio ulteriore: il dubbio sollevato da uno diventa un chiarimento anche per l'altro, che magari non lo aveva ancora formulato.<\u002Fp>\n            <p style=\"font-size:15.5px; line-height:1.7; color:#5A5F7C; margin:0\">È sufficiente un compagno che segua lo stesso programma: un amico di classe o di corso è la soluzione più naturale. Se non hai nessuno con cui abbinarti, segnalamelo: quando seguo un altro studente sulla stessa materia, posso proporvi di procedere insieme.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"min-width:0; display:flex; flex-direction:column; gap:12px\">\n            <div style=\"display:flex; gap:14px; align-items:flex-start; background:#FBFAF7; border:1px solid #F0EDE5; border-radius:16px; padding:18px 20px\">\n              <span style=\"flex:none; width:38px; height:38px; border-radius:11px; background:#FDEDE4; color:#C9541F; display:flex; align-items:center; justify-content:center\"><span style=\"font-family:'Material Symbols Outlined'; font-size:21px; line-height:1\">savings<\u002Fspan><\u002Fspan>\n              <div style=\"min-width:0\"><div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:15.5px; margin-bottom:4px\">Costo per persona più basso<\u002Fdiv><div style=\"font-size:14.5px; line-height:1.6; color:#5A5F7C\">Ogni ora costa 5 € in meno a persona: con la stessa spesa annuale si possono seguire più lezioni.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:14px; align-items:flex-start; background:#FBFAF7; border:1px solid #F0EDE5; border-radius:16px; padding:18px 20px\">\n              <span style=\"flex:none; width:38px; height:38px; border-radius:11px; background:#EEF0FF; color:#2A3186; display:flex; align-items:center; justify-content:center\"><span style=\"font-family:'Material Symbols Outlined'; font-size:21px; line-height:1\">history_edu<\u002Fspan><\u002Fspan>\n              <div style=\"min-width:0\"><div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:15.5px; margin-bottom:4px\">Un compagno di studio anche a casa<\u002Fdiv><div style=\"font-size:14.5px; line-height:1.6; color:#5A5F7C\">Il beneficio maggiore emerge dopo la lezione: i compiti vengono svolti confrontandosi, i passaggi più difficili si affrontano insieme e nessuno resta fermo per giorni sullo stesso esercizio.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:14px; align-items:flex-start; background:#FBFAF7; border:1px solid #F0EDE5; border-radius:16px; padding:18px 20px\">\n              <span style=\"flex:none; width:38px; height:38px; border-radius:11px; background:#EEF0FF; color:#2A3186; display:flex; align-items:center; justify-content:center\"><span style=\"font-family:'Material Symbols Outlined'; font-size:21px; line-height:1\">mood<\u002Fspan><\u002Fspan>\n              <div style=\"min-width:0\"><div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:15.5px; margin-bottom:4px\">Studiare diventa più piacevole<\u002Fdiv><div style=\"font-size:14.5px; line-height:1.6; color:#5A5F7C\">Una materia impegnativa affrontata in compagnia risulta meno gravosa, e la presenza di un compagno rende più difficile rinviare lo studio.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:14px; align-items:flex-start; background:#FBFAF7; border:1px solid #F0EDE5; border-radius:16px; padding:18px 20px\">\n              <span style=\"flex:none; width:38px; height:38px; border-radius:11px; background:#EEF0FF; color:#2A3186; display:flex; align-items:center; justify-content:center\"><span style=\"font-family:'Material Symbols Outlined'; font-size:21px; line-height:1\">groups<\u002Fspan><\u002Fspan>\n              <div style=\"min-width:0\"><div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:15.5px; margin-bottom:4px\">Spiegarsi a vicenda consolida<\u002Fdiv><div style=\"font-size:14.5px; line-height:1.6; color:#5A5F7C\">Riformulare un passaggio per il compagno è la verifica più rapida di averlo compreso: un ripasso che prosegue anche fuori dalla lezione.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"margin-top:22px; display:flex; flex-wrap:wrap; align-items:center; gap:20px; justify-content:space-between; background:#EEF0FF; border:1px solid #DDDFF6; border-radius:18px; padding:26px\">\n        <div style=\"min-width:0; max-width:520px\">\n          <div style=\"font-family:Sora,sans-serif; font-weight:600; font-size:clamp(16.5px,4.3vw,18px); color:#232A63; letter-spacing:-0.015em; margin-bottom:6px\">Prenota la prima lezione<\u002Fdiv>\n          <div style=\"font-size:14.5px; color:#5A5F7C; line-height:1.55\">Tariffa oraria, durata concordata, nessun pacchetto da acquistare. Indicami se preferisci lezioni individuali o in coppia e definiamo il calendario.<\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"#contatti\" style=\"flex:0 1 auto; display:flex; align-items:center; justify-content:center; min-height:clamp(48px,12vw,56px); white-space:nowrap; background:#E2652B; color:#fff; padding:0 clamp(20px,5.5vw,32px); border-radius:14px; font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15px,3.9vw,17px); box-shadow:0 14px 30px -14px rgba(226,101,43,0.85)\" style-hover=\"background:#C9541F; color:#fff; transform:translateY(-2px)\">Prenota ora →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contatti\" style=\"padding:clamp(64px,8vw,110px) 22px; background:#F4F2EC; border-top:1px solid #E7E3DA\">\n    <div style=\"max-width:1140px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:clamp(32px,5vw,60px); align-items:start\">\n      <div data-reveal=\"1\" style=\"min-width:0\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; color:#E2652B; letter-spacing:0.08em; margin-bottom:16px\">CONTATTI<\u002Fdiv>\n        <h2 style=\"font-family:Sora,sans-serif; font-weight:700; font-size:clamp(28px,3.6vw,42px); line-height:1.12; letter-spacing:-0.025em; margin:0 0 18px; text-wrap:balance\">Prenota la tua prima lezione<\u002Fh2>\n        <p style=\"font-size:16.5px; line-height:1.7; color:#4B5070; margin:0 0 30px; max-width:480px\">Scrivimi indicando la materia, la classe o il corso di laurea e gli argomenti su cui vorresti lavorare. Ti risponderò con le disponibilità in calendario.<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:20px; max-width:440px\">\n          <div style=\"display:flex; flex-direction:column; gap:8px\">\n            <span style=\"font-size:12.5px; color:#5A5F7C; font-weight:700; letter-spacing:0.06em\">SCRIVIMI nd:#fff\">\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:7px\">\n            <label for=\"messaggio\" style=\"font-size:13.5px; font-weight:600; color:#4B5070; letter-spacing:0.01em\">Messaggio<\u002Flabel>\n            <textarea id=\"messaggio\" name=\"messaggio\" rows=\"5\" required=\"\" placeholder=\"Materia, classe o corso di laurea, argomenti da affrontare e se preferisci lezioni individuali o in coppia\" style=\"background:#FBFAF7; border:1px solid #E2E0D6; border-radius:12px; padding:14px 16px; font-size:15.5px; outline:none; width:100%; resize:vertical; font-family:Manrope,sans-serif\" style-focus=\"border-color:#232A63; background:#fff\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <button type=\"submit\" style=\"background:#E2652B; color:#fff; border:none; border-radius:14px; padding:clamp(14px,3.6vw,17px) 22px; font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15px,3.8vw,16.5px); cursor:pointer; box-shadow:0 14px 28px -14px rgba(226,101,43,0.8)\" style-hover=\"background:#C9541F\">Prenota ora<\u002Fbutton>\n          <p style=\"margin:0; font-size:13.5px; color:#5A5F7C; line-height:1.55; text-align:center\">Il pulsante apre il messaggio nel tuo programma di posta, già indirizzato a leo.rufini.459@gmail.com.<\u002Fp>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#171A33; color:#B9BEE8; padding:clamp(40px,5vw,56px) 22px 34px\">\n    <div style=\"max-width:1140px; margin:0 auto; display:flex; flex-wrap:wrap; gap:26px; justify-content:space-between; align-items:flex-start\">\n      <div style=\"min-width:0\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:12px\">\n          <span style=\"width:32px; height:32px; border-radius:9px; background:#2A3186; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:14px\">LR<\u002Fspan>\n          <span style=\"font-family:Sora,sans-serif; font-weight:600; font-size:16px; color:#fff\">Leonardo Rufini<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:14.5px; line-height:1.6; max-width:340px\">Ripetizioni di matematica, fisica e informatica, online e in presenza a Roma.<\u002Fp>\n      <\u002Fdiv>\n      <nav style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),auto)); gap:4px 34px; font-size:15px\">\n        <a href=\"#chi-sono\" style=\"color:#B9BEE8; display:flex; align-items:center; min-height:40px\" style-hover=\"color:#fff\">Chi sono<\u002Fa>\n        <a href=\"#materie\" style=\"color:#B9BEE8; display:flex; align-items:center; min-height:40px\" style-hover=\"color:#fff\">Materie<\u002Fa>\n        <a href=\"#perche\" style=\"color:#B9BEE8; display:flex; align-items:center; min-height:40px\" style-hover=\"color:#fff\">Perché scegliermi<\u002Fa>\n        <a href=\"#lezioni\" style=\"color:#B9BEE8; display:flex; align-items:center; min-height:40px\" style-hover=\"color:#fff\">Come funzionano<\u002Fa>\n        <a href=\"#prezzi\" style=\"color:#B9BEE8; display:flex; align-items:center; min-height:40px\" style-hover=\"color:#fff\">Prezzi<\u002Fa>\n        <a href=\"#contatti\" style=\"color:#B9BEE8; display:flex; align-items:center; min-height:40px\" style-hover=\"color:#fff\">Contatti<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"max-width:1140px; margin:34px auto 0; padding-top:22px; border-top:1px solid rgba(255,255,255,0.12); font-size:13.5px; color:#9FA4C4\">© 2026 Leonardo Rufini<\u002Fdiv>\n  <\u002Ffooter>\n\n  <div data-mobile-cta=\"1\" style=\"display:none; position:fixed; left:0; right:0; bottom:0; z-index:60; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:rgba(251,250,247,0.94); backdrop-filter:blur(12px); border-top:1px solid #E2E0D6; transform:translateY(115%); opacity:0; transition:transform .42s cubic-bezier(.22,.7,.3,1), opacity .3s ease; will-change:transform\">\n    <div style=\"display:flex; gap:10px; align-items:stretch\">\n      <a href=\"#contatti\" style=\"flex:1; display:flex; align-items:center; justify-content:center; min-height:52px; border-radius:14px; background:#E2652B; color:#fff; font-family:Sora,sans-serif; font-weight:600; font-size:clamp(15px,3.9vw,16.5px)\" style-hover=\"background:#C9541F; color:#fff\">Prenota ora<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.seen = new WeakSet();\n    this.scan();\n    this.timer = setInterval(() => this.scan(), 500);\n    this._sc = () => this.check();\n    window.addEventListener('scroll', this._sc, { passive: true });\n    window.addEventListener('resize', this._sc);\n    this.navFix();\n  }\n  componentDidUpdate() { this.scan(); this.navFix(); }\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    window.removeEventListener('scroll', this._sc);\n    window.removeEventListener('resize', this._sc);\n    if (this._rz) window.removeEventListener('resize', this._rz);\n    if (this.io) this.io.disconnect();\n    if (this.heroIO) this.heroIO.disconnect();\n    document.querySelectorAll('[data-reveal=\"1\"]').forEach(n => { n.style.opacity = '1'; n.style.transform = 'none'; });\n  }\n\n  applyBar(gone) {\n    const bar = document.querySelector('[data-mobile-cta=\"1\"]');\n    if (!bar) return;\n    const show = gone && window.innerWidth < 760;\n    bar.style.transform = show ? 'translateY(0)' : 'translateY(115%)';\n    bar.style.opacity = show ? '1' : '0';\n    bar.style.pointerEvents = show ? 'auto' : 'none';\n  }\n\n  dockBar() {\n    const hero = document.querySelector('[data-hero-cta=\"1\"]');\n    if (!hero) { this.applyBar(false); return; }\n    // observer-driven: works whichever element is the scroller\n    if ('IntersectionObserver' in window && !this.heroIO) {\n      this.heroIO = new IntersectionObserver(entries => {\n        entries.forEach(e => { this._heroVisible = e.isIntersecting; this.applyBar(!e.isIntersecting); });\n      }, { threshold: 0 });\n    }\n    if (this.heroIO && this._heroWatched !== hero) { this.heroIO.disconnect(); this.heroIO.observe(hero); this._heroWatched = hero; }\n    if (this._heroVisible === undefined) this.applyBar(hero.getBoundingClientRect().bottom < 8);\n    else this.applyBar(!this._heroVisible);\n  }\n\n  check() {\n    this.dockBar();\n    document.querySelectorAll('[data-reveal=\"1\"]').forEach(n => {\n      if (n.style.opacity === '0' && n.getBoundingClientRect().top < window.innerHeight * 0.92) {\n        n.style.opacity = '1'; n.style.transform = 'none';\n      }\n    });\n  }\n\n  navFix() {\n    const root = this.root();\n    if (!root) return;\n    const wide = window.innerWidth >= 760;\n    root.querySelectorAll('[data-nav=\"1\"]').forEach(a => { a.style.display = wide ? 'inline' : 'none'; });\n    const bar = document.querySelector('[data-mobile-cta=\"1\"]');\n    if (bar) {\n      bar.style.display = wide ? 'none' : 'block';\n      document.body.style.paddingBottom = wide ? '0px' : '84px';\n      this.dockBar();\n    }\n    if (!this._rz) { this._rz = () => this.navFix(); window.addEventListener('resize', this._rz); }\n  }\n\n  root() { return this._el || (this._el = document.querySelector('[data-reveal]') ? document.body : document.body); }\n\n  scan() {\n    if (!this.seen) this.seen = new WeakSet();\n    const nodes = document.querySelectorAll('[data-reveal=\"1\"]');\n    if (!nodes.length) return;\n    const hasIO = 'IntersectionObserver' in window;\n    if (hasIO && !this.io) {\n      this.io = new IntersectionObserver(entries => {\n        entries.forEach(e => {\n          if (e.isIntersecting) {\n            e.target.style.opacity = '1';\n            e.target.style.transform = 'none';\n            this.io.unobserve(e.target);\n          }\n        });\n      }, { threshold: 0, rootMargin: '0px 0px -6% 0px' });\n    }\n    nodes.forEach(n => {\n      if (this.seen.has(n)) return;\n      this.seen.add(n);\n      const r = n.getBoundingClientRect();\n      if (!hasIO || r.top < window.innerHeight * 0.92) { n.style.opacity = '1'; n.style.transform = 'none'; return; }\n      n.style.opacity = '0';\n      n.style.transform = 'translateY(20px)';\n      n.style.transition = 'opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1)';\n      this.io.observe(n);\n    });\n    this.check();\n  }\n\n  renderVals() {\n    return {\n      submit: (e) => {\n        e.preventDefault();\n        const f = e.target;\n        const nome = (f.nome && f.nome.value || '').trim();\n        const email = (f.email && f.email.value || '').trim();\n        const msg = (f.messaggio && f.messaggio.value || '').trim();\n        const body = 'Nome: ' + nome + '\\nEmail: ' + email + '\\n\\n' + msg;\n        window.location.href = 'mailto:leo.rufini.459@gmail.com?subject=' +\n          encodeURIComponent('Richiesta ripetizioni — ' + (nome || 'nuovo contatto')) +\n          '&body=' + encodeURIComponent(body);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
